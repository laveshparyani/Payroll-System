name: PHP Lint

# CodeQL does not support PHP, so this workflow provides the code-quality
# gate instead: it checks every PHP file for syntax errors on each push and
# pull request to main.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: php -l (syntax check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint all PHP files
        run: |
          echo "Linting PHP files..."
          error=0
          while IFS= read -r -d '' file; do
            output=$(php -l "$file" 2>&1) || { echo "$output"; error=1; }
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          if [ "$error" -eq 1 ]; then
            echo "PHP syntax errors found."
            exit 1
          fi
          echo "All PHP files passed the syntax check."
